name: Update README with Latest Content

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest YouTube videos and Medium articles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Profile Updater Script
        run: node .github/scripts/update-profile.js

      - name: Commit and Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md. Skipping commit."
            exit 0
          fi

          echo "Changes detected in README.md. Committing via GitHub API to ensure verified signature..."
          
          REPO="$GITHUB_REPOSITORY"
          BRANCH="main"
          OID=$(git rev-parse HEAD)
          MSG="chore: update latest youtube videos and medium articles"
          
          # Base64 encode the file content
          B64_CONTENT=$(cat README.md | base64 | tr -d '\r\n')
          
          gh api graphql -f query='
            mutation($githubRepository: String!, $branchName: String!, $expectedHeadOid: GitObjectID!, $commitMessage: String!, $files: [FileAddition!]!) {
              createCommitOnBranch(input: {
                branch: { repositoryNameWithOwner: $githubRepository, branchName: $branchName },
                message: { headline: $commitMessage },
                fileChanges: { additions: $files },
                expectedHeadOid: $expectedHeadOid
              }) {
                commit {
                  url
                }
              }
            }' \
            -f githubRepository="$REPO" \
            -f branchName="$BRANCH" \
            -f expectedHeadOid="$OID" \
            -f commitMessage="$MSG" \
            -F files[][path]="README.md" \
            -F files[][contents]="$B64_CONTENT"
